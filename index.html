<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IMS Portal</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            background: linear-gradient(-45deg, #667eea, #764ba2, #42a5f5, #7b1fa2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* ================= NAVBAR ================= */

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 50px;

            position: fixed;
            top: 0;
            left: 0;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);

            z-index: 1000;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        nav h1 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        nav button {
            margin-left: 10px;
            padding: 12px 22px;

            border: none;
            border-radius: 25px;

            cursor: pointer;

            font-weight: 600;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            transition: all 0.3s ease;
        }

        nav button i {
            font-size: 20px;
            transition: 0.3s;
        }

        .signup {
            background: #00c853;
            color: white;
        }

        .signup:hover {
            background: #00e676;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .login {
            background: #ffab00;
            color: white;
        }

        .login:hover {
            background: #ffc400;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        nav button:hover i {
            transform: scale(1.3) rotate(10deg);
        }


        /* ================= HERO ================= */

        .hero {
            margin-top: 180px;
            text-align: center;
            color: white;

            padding: 20px;

            animation: fadeIn 1.2s ease forwards;
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 15px;

            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.4);
        }

        .hero-icon {
            font-size: 55px;
            margin-right: 10px;

            animation: floatIcon 3s ease-in-out infinite;
        }

        .hero p {
            font-size: 1.2rem;
            text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.3);
        }


        /* ================= MODAL ================= */

        .modal {
            display: none;

            position: fixed;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            background: rgba(0, 0, 0, 0.6);

            justify-content: center;
            align-items: center;

            z-index: 2000;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.1);

            border-radius: 20px;

            padding: 35px 30px;
            width: 360px;

            text-align: center;

            backdrop-filter: blur(15px);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            animation: modalFade 0.4s ease forwards;
        }

        .modal-box h3 {
            margin-bottom: 20px;
            color: white;
            font-size: 1.5rem;
        }

        .modal-box input[type="text"],
        .modal-box input[type="email"],
        .modal-box input[type="password"] {
            width: 100%;

            padding: 14px;
            margin: 10px 0;

            border-radius: 12px;
            border: none;
            outline: none;

            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .modal-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-box input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }


        /* ================= BUTTONS ================= */

        .modal-box button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #667eea;
            color: white;

            margin-top: 15px;

            font-weight: 600;
            cursor: pointer;

            transition: 0.3s;
        }

        .modal-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .close {
            background: #ff5252 !important;
        }


        /* ================= SHOW PASSWORD ================= */

        .show-pass {
            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 8px;

            margin: 10px 0;

            color: white;
            font-size: 14px;
        }

        .show-pass input {
            width: auto;
            cursor: pointer;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes floatIcon {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalFade {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* ================= MOBILE ================= */

        @media(max-width: 600px) {

            nav {
                padding: 15px 20px;
            }

            nav h1 {
                font-size: 1.3rem;
            }

            nav button {
                padding: 9px 13px;
                font-size: 12px;
            }

            nav button i {
                font-size: 15px;
            }

            .hero {
                margin-top: 150px;
            }

            .hero h2 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .modal-box {
                width: 90%;
            }
        }

    </style>
</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <h1>IMS Portal</h1>

        <div>

            <button class="signup" onclick="openModal('signup')">
                <i class="fas fa-user-plus"></i>
                Sign Up
            </button>

            <button class="login" onclick="openModal('login')">
                <i class="fas fa-right-to-bracket"></i>
                Login
            </button>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <div class="hero">

        <h2>
            <i class="fas fa-boxes hero-icon"></i>
            Smart Inventory Management
        </h2>

        <p>Manage your stock, sales & purchases with ease 🚀</p>

    </div>


    <!-- ================= SIGNUP MODAL ================= -->

    <div class="modal" id="signup">

        <div class="modal-box">

            <h3>Create Account</h3>

            <form onsubmit="signupUser(event)">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="signupPhone"
                    placeholder="Phone"
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    id="signupCPassword"
                    placeholder="Confirm Password"
                    required
                >

                <div class="show-pass">

                    <input
                        type="checkbox"
                        onclick="togglePassword('signupPassword','signupCPassword')"
                    >

                    Show Password

                </div>

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <button class="close" onclick="closeModal('signup')">
                Close
            </button>

        </div>

    </div>


    <!-- ================= LOGIN MODAL ================= -->

    <div class="modal" id="login">

        <div class="modal-box">

            <h3>Login</h3>

            <form onsubmit="loginUser(event)">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <div class="show-pass">

                    <input
                        type="checkbox"
                        onclick="togglePassword('loginPassword')"
                    >

                    Show Password

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <button class="close" onclick="closeModal('login')">
                Close
            </button>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function openModal(id) {
            document.getElementById(id).style.display = "flex";
        }


        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }


        window.onclick = function(event) {

            let signup = document.getElementById('signup');
            let login = document.getElementById('login');

            if (event.target === signup) {
                signup.style.display = "none";
            }

            if (event.target === login) {
                login.style.display = "none";
            }

        };


        function togglePassword(passId, confirmId = null) {

            let passField = document.getElementById(passId);

            passField.type =
                passField.type === 'password'
                ? 'text'
                : 'password';


            if (confirmId) {

                let confirmField =
                    document.getElementById(confirmId);

                confirmField.type =
                    confirmField.type === 'password'
                    ? 'text'
                    : 'password';

            }

        }


        // DEMO SIGNUP
        function signupUser(event) {

            event.preventDefault();

            let password =
                document.getElementById("signupPassword").value;

            let confirmPassword =
                document.getElementById("signupCPassword").value;


            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;

            }


            alert(
                "Signup successful! Backend connection is required to save the user."
            );

        }


        // DEMO LOGIN
        function loginUser(event) {

            event.preventDefault();

            alert(
                "Login submitted! Connect this form to PHP/MySQL for real authentication."
            );

        }

    </script>

</body>
</html>
